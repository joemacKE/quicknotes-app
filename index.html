<!DOCTYPE>
<html lang="eng">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QuickNotes</title>
        <link rel="styesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>QuickNotes</h1>
            <p>Capute your thoughs, tasks, and ideas in one place.</p>
        </header>
        <main>
            <section id="add-note-section">
                <h2>Add a note</h2>
                <form id="note-form">
                    <label for="note-input">Your Note</label>

                    <input type="text" id="note-input" placeholder="Type your note..." >

                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                    <button type="submit">Add Note</button>
                </form>
                <p id="error-message"></p>
            </section>

             <section id="your-notes-section">
                <h2>Your notes</h2>

                <label for="search-input">Search notes</label>
                <input type="search" id="search-input" placeholder="Search your notes..." >
                <p id="note-count">You have no notes yet.</p>
                <ul id="notes-list"></ul>
                
                
            </section>
            
        </main>
        <footer>
            <p>&copy 2026 QuickNotes. ALl rights reserved</p>
        </footer>
    </body>
</html>
